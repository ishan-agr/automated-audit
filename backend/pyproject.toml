[project]
name = "automated-audit-backend"
version = "0.1.0"
description = "Automated month-wise personal-expense audit system — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "cryptography>=42.0",
    "pypdf>=5.0",
    "python-ulid>=2.5",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
# Real extraction engine (heavy: torch + docling + model weights). Optional so the
# base install stays light; enable with: uv pip install -e ".[docling]"
docling = [
    "docling>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# B008: FastAPI relies on Depends()/File()/Form() in argument defaults.
# UP042: `str, Enum` is intentional (stable pydantic/SQLModel value serialization).
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing app modules — imports intentionally late.
"tests/conftest.py" = ["E402"]
# test fixtures embed real statement rows (long lines) + en-dashes in comments.
"tests/test_axis_parser.py" = ["E501"]
"tests/test_structuring.py" = ["E501"]
"tests/test_reconcile.py" = ["RUF003"]
